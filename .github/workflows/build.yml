# Builds Spek on Linux, macOS and Windows and uploads the resulting
# binaries (which double as the command line tool and as the graphical
# application) as workflow artefacts.
#
# macOS uses Homebrew. Windows and the self-contained Linux builds use vcpkg.
# The Linux overlay triplets also build the X11 stack statically instead of
# picking up shared libraries from the runner. See vcpkg.json and INSTALL.md.

name: Build

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

env:
  # Don't let vcpkg phone home.
  VCPKG_DISABLE_METRICS: 1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      checks: write

    # std::expected needs GCC 13 or newer, or Clang 19 or newer with a
    # matching standard library: the Ubuntu image only has Clang 18, which
    # is too old, so the Linux jobs use GCC, on x86-64 and on aarch64.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: ubuntu-latest (GCC 13)
            compiler: g++-13
            cc: gcc-13
            cxx: g++-13
            triplet: x64-linux-static
            cache_id: x64-linux-static-gcc13
            artifact: spek-cli-gui-ubuntu
          - os: ubuntu-latest
            name: ubuntu-latest (GCC 14)
            compiler: g++-14
            cc: gcc-14
            cxx: g++-14
            triplet: x64-linux-static
            cache_id: x64-linux-static-gcc14
            artifact: spek-cli-gui-ubuntu-gcc14
          - os: ubuntu-24.04-arm
            name: ubuntu-24.04-arm (GCC 13)
            compiler: g++-13
            cc: gcc-13
            cxx: g++-13
            triplet: arm64-linux-static
            cache_id: arm64-linux-static-gcc13
            artifact: spek-cli-gui-linux-aarch64
          - os: macos-latest
            name: macos-latest (Apple Clang)
            cc: clang
            cxx: clang++
            artifact: spek-cli-gui-macos
          - os: windows-latest
            name: windows-latest (MSVC)
            triplet: x64-windows
            cache_id: x64-windows
            artifact: spek-cli-gui-windows
          # The same Windows build with wxWidgets, FFmpeg and the runtime
          # linked in statically: a single spek.exe which needs no DLLs.
          - os: windows-latest
            name: windows-latest (MSVC, static)
            triplet: x64-windows-static
            cache_id: x64-windows-static
            artifact: spek-cli-gui-windows-static

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- Linux
      - name: Install the dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            autoconf-archive \
            automake \
            bison \
            cmake \
            gettext \
            gperf \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libglu1-mesa-dev \
            libibus-1.0-dev \
            libltdl-dev \
            libtool \
            libwayland-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxft-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxrender-dev \
            libxtst-dev \
            linux-libc-dev \
            nasm \
            ninja-build \
            pkg-config \
            "${{ matrix.compiler }}"

      # ---------------------------------------------------------------- macOS
      - name: Install the dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja pkg-config ffmpeg wxwidgets gettext

      # ------------------------------------------------------- vcpkg packages
      # Windows and the self-contained Linux binaries use static dependencies
      # from vcpkg. Restoring and saving are two steps on purpose: compiling
      # wxWidgets, GTK and FFmpeg takes a while, and a single cache step would
      # throw the packages away whenever the job fails.
      - name: Restore the vcpkg binary packages (Linux, Windows)
        if: runner.os == 'Linux' || runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ matrix.cache_id }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'packaging/vcpkg/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.cache_id }}-

      - name: Prepare the build environment (Linux)
        if: runner.os == 'Linux'
        run: |
          vcpkg="${VCPKG_INSTALLATION_ROOT:-${VCPKG_ROOT:-}}"
          if [[ -z "$vcpkg" ]]; then
            echo "Cannot find vcpkg on this runner" >&2
            exit 1
          fi
          toolchain="$vcpkg/scripts/buildsystems/vcpkg.cmake"
          if [[ ! -f "$toolchain" ]]; then
            echo "Cannot find $toolchain" >&2
            exit 1
          fi
          echo "SPEK_VCPKG_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite"
          VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$SPEK_VCPKG_TOOLCHAIN" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DSPEK_BUILD_TESTS=ON \
            -DSPEK_STATIC_LINK=ON 2>&1 | tee configure.log

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$(brew --prefix);$(brew --prefix)/opt/gettext"
          -DSPEK_BUILD_TESTS=ON

      # The runner image ships vcpkg, but its location is only announced
      # through an environment variable.
      - name: Prepare the build environment (Windows)
        if: runner.os == 'Windows'
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = $env:VCPKG_ROOT }
          if (-not $vcpkg) { throw "Cannot find vcpkg on this runner" }
          $toolchain = Join-Path $vcpkg 'scripts/buildsystems/vcpkg.cmake'
          if (-not (Test-Path $toolchain)) { throw "Cannot find $toolchain" }
          Add-Content -Path $env:GITHUB_ENV -Value "SPEK_VCPKG_TOOLCHAIN=$toolchain"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-bincache,readwrite"
          VCPKG_TARGET_TRIPLET: ${{ matrix.triplet }}
        # No -G on purpose: CMake picks the newest Visual Studio of the
        # image, which is also what vcpkg builds its packages with.
        run: >
          cmake -B build -S . -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:SPEK_VCPKG_TOOLCHAIN"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          -DSPEK_BUILD_TESTS=ON

      # --config is what the multi-configuration generators need, the
      # single-configuration ones ignore it.
      - name: Build
        id: build
        run: cmake --build build --config Release

      # TEMPORARY: publish Linux configure/link failures where they can be
      # diagnosed without access to the runner.
      - name: Report the Linux build errors
        if: failure() && runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "${{ steps.build.outcome }}" == "failure" ]]; then
            cmake --build build --config Release > build.log 2>&1 || true
          fi
          cat configure.log build.log 2>/dev/null > build-failure.log || true
          if [[ ! -s build-failure.log ]]; then
            echo "The job failed before producing a build log." > build-failure.log
          fi
          jq -Rs --arg sha "$GITHUB_SHA" \
            --arg name "build-log (${{ matrix.name }})" \
            '{name: $name, head_sha: $sha, status: "completed",
              conclusion: "failure",
              output: {title: "Build log", summary: "The build failed",
              text: (.[-60000:])}}' build-failure.log |
            gh api -X POST "repos/$GH_REPO/check-runs" --input -
          exit 1

      - name: Run the test suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke test the command line interface (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          ./build/src/spek --version
          ./build/src/spek --cli --input tests/samples --output build/spectrograms --width 100

      - name: Smoke test the command line interface (Windows)
        if: runner.os == 'Windows'
        run: |
          .\build\src\Release\spek.exe --version
          .\build\src\Release\spek.exe --cli --input tests/samples --output build/spectrograms --width 100

      # A fully static executable has no DT_NEEDED entries. Check this rather
      # than relying on the build machine, which can satisfy accidental
      # dynamic dependencies from its system directories.
      - name: Check that the Linux binary is self-contained
        if: runner.os == 'Linux'
        run: |
          file build/src/spek
          if readelf -d build/src/spek | grep -q '(NEEDED)'; then
            echo "The static Linux binary still has dynamic dependencies:" >&2
            readelf -d build/src/spek | grep '(NEEDED)' >&2
            exit 1
          fi

      # vcpkg copies the DLLs of its packages next to the binary, so there
      # must not be any when everything is linked statically.
      - name: Check that the static binary is self-contained
        if: matrix.triplet == 'x64-windows-static'
        run: |
          $dlls = Get-ChildItem -Path build\src\Release\*.dll -ErrorAction SilentlyContinue
          if ($dlls) {
              Write-Error "the static build is not static: $($dlls.Name -join ', ')"
              exit 1
          }

      # ------------------------------------------------------------ artefacts
      - name: Collect the binaries (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "${{ matrix.artifact }}"
          cp build/src/spek "${{ matrix.artifact }}/"
          ls -la "${{ matrix.artifact }}"

      - name: Collect the binaries (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path "${{ matrix.artifact }}"
          Copy-Item build\src\Release\spek.exe -Destination "${{ matrix.artifact }}\"
          Get-ChildItem -Path build\src\Release\*.dll -ErrorAction SilentlyContinue |
            Copy-Item -Destination "${{ matrix.artifact }}\"
          Get-ChildItem "${{ matrix.artifact }}"

      - name: Save the vcpkg binary packages (Linux, Windows)
        if: (runner.os == 'Linux' || runner.os == 'Windows') && always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ matrix.cache_id }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'packaging/vcpkg/**') }}

      - name: Upload the artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
